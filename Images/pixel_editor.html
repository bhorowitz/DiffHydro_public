<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pixel Editor — output/big_bang_modified.png</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f1a; color: #e0e0f0; font-family: 'Segoe UI', sans-serif; padding: 16px; }
  h1 { font-size: 1.1rem; margin-bottom: 12px; color: #a0b0ff; }

  #toolbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    background: #1a1a2e; border: 1px solid #333; border-radius: 8px;
    padding: 12px; margin-bottom: 12px;
  }
  .tool-group { display: flex; flex-direction: column; gap: 4px; }
  .tool-group label { font-size: 0.72rem; color: #888; text-transform: uppercase; letter-spacing: .04em; }

  select, input[type=range] { background: #0f0f1a; color: #e0e0f0; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; font-size: 0.85rem; }
  input[type=color] { width: 48px; height: 32px; border: none; border-radius: 4px; cursor: pointer; background: none; }

  button {
    padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer;
    font-size: 0.82rem; font-weight: 600; transition: .15s;
  }
  #btn-apply { background: #5b6af5; color: #fff; }
  #btn-apply:hover { background: #7080ff; }
  #btn-undo { background: #333; color: #ccc; }
  #btn-undo:hover { background: #444; }
  #btn-download { background: #2a7a4f; color: #fff; }
  #btn-download:hover { background: #3aaa6f; }
  #btn-clear { background: #5a2a2a; color: #fcc; }
  #btn-clear:hover { background: #7a3a3a; }

  #info-bar {
    display: flex; gap: 20px; align-items: center;
    background: #12121f; border: 1px solid #2a2a40; border-radius: 6px;
    padding: 8px 14px; margin-bottom: 10px; font-size: 0.82rem;
  }
  .info-item { display: flex; align-items: center; gap: 6px; }
  .info-item span { color: #7ad; font-weight: 600; }
  #pixel-preview { width: 22px; height: 22px; border-radius: 3px; border: 1px solid #555; }

  #canvas-wrapper {
    position: relative; display: inline-block; cursor: crosshair;
    border: 1px solid #334; border-radius: 4px; overflow: hidden;
  }
  #main-canvas { display: block; max-width: 100%; }
  #overlay-canvas { position: absolute; top:0; left:0; pointer-events: none; }

  #selections-list {
    margin-top: 12px; background: #12121f; border: 1px solid #2a2a40;
    border-radius: 6px; padding: 10px; max-height: 200px; overflow-y: auto;
  }
  #selections-list h3 { font-size: 0.8rem; color: #888; margin-bottom: 8px; }
  .sel-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; background: #1a1a2e; border-radius: 4px;
    margin-bottom: 4px; font-size: 0.78rem;
  }
  .sel-color { width: 18px; height: 18px; border-radius: 3px; border: 1px solid #555; flex-shrink: 0; }
  .sel-info { flex: 1; color: #aaa; }
  .sel-remove { background: #5a2a2a; color: #fcc; border: none; border-radius: 3px; padding: 2px 6px; cursor: pointer; font-size: 0.72rem; }
</style>
</head>
<body>

<h1>🎨 Pixel Zone Editor — output/big_bang_modified.png</h1>

<div id="toolbar">
  <div class="tool-group">
    <label>Mode</label>
    <select id="mode">
      <option value="inspect">🔍 Inspecter pixel</option>
      <option value="select" selected>⬛ Sélectionner zone</option>
    </select>
  </div>
  <div class="tool-group">
    <label>Couleur de remplacement</label>
    <input type="color" id="fill-color" value="#ff6600">
  </div>
  <div class="tool-group">
    <label>Opacité (%)</label>
    <input type="range" id="fill-opacity" min="0" max="100" value="100" style="width:100px">
    <span id="opacity-val" style="font-size:.75rem;color:#aaa">100%</span>
  </div>
  <div class="tool-group">
    <label>Actions</label>
    <div style="display:flex;gap:6px">
      <button id="btn-apply">✅ Appliquer sélections</button>
      <button id="btn-undo">↩ Annuler</button>
      <button id="btn-clear">🗑 Tout effacer</button>
      <button id="btn-download">💾 Télécharger PNG</button>
    </div>
  </div>
</div>

<div id="info-bar">
  <div class="info-item">Position : <span id="pos-display">—</span></div>
  <div class="info-item">Pixel : <div id="pixel-preview"></div> <span id="pixel-rgb">—</span></div>
  <div class="info-item">Sélections : <span id="sel-count">0</span></div>
  <div class="info-item">Mode : <span id="mode-display">Sélectionner</span></div>
</div>

<div id="canvas-wrapper">
  <canvas id="main-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>
</div>

<div id="selections-list">
  <h3>📋 Sélections en attente</h3>
  <div id="sel-items"></div>
</div>

<script>
const IMG_SRC = "/mnt/data2/travail/stage/DiffHydro_public/Images/output/big_bang_modified.png";
const canvas = document.getElementById('main-canvas');
const overlay = document.getElementById('overlay-canvas');
const ctx = canvas.getContext('2d');
const octx = overlay.getContext('2d');

const img = new Image();
let scale = 1;
let history = [];
let selections = [];
let dragging = false;
let startX = 0, startY = 0, curX = 0, curY = 0;

img.onload = () => {
  const maxW = Math.min(window.innerWidth - 40, 1430);
  scale = maxW / img.width;
  canvas.width = overlay.width = Math.round(img.width * scale);
  canvas.height = overlay.height = Math.round(img.height * scale);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
};
img.src = IMG_SRC;

// ——— Coordonnées réelles depuis position souris ———
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: Math.round((e.clientX - rect.left) * scaleX),
    y: Math.round((e.clientY - rect.top) * scaleY)
  };
}

// ——— Afficher couleur pixel sous curseur ———
canvas.addEventListener('mousemove', (e) => {
  const {x, y} = getPos(e);
  document.getElementById('pos-display').textContent = `${x}, ${y}`;
  const px = ctx.getImageData(x, y, 1, 1).data;
  const hex = '#' + [px[0],px[1],px[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  document.getElementById('pixel-preview').style.background = hex;
  document.getElementById('pixel-rgb').textContent = `rgb(${px[0]},${px[1]},${px[2]}) ${hex}`;

  if (dragging && document.getElementById('mode').value === 'select') {
    curX = x; curY = y;
    drawOverlay();
  }
});

canvas.addEventListener('mousedown', (e) => {
  const {x, y} = getPos(e);
  const mode = document.getElementById('mode').value;

  if (mode === 'inspect') {
    const px = ctx.getImageData(x, y, 1, 1).data;
    console.log(`Pixel ${x},${y} : rgb(${px[0]},${px[1]},${px[2]})`);
  } else if (mode === 'select') {
    dragging = true;
    startX = curX = x;
    startY = curY = y;
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (!dragging) return;
  dragging = false;
  const {x, y} = getPos(e);
  curX = x; curY = y;

  const x1 = Math.min(startX, curX), y1 = Math.min(startY, curY);
  const w = Math.abs(curX - startX), h = Math.abs(curY - startY);

  if (w > 3 && h > 3) {
    const color = document.getElementById('fill-color').value;
    const opacity = parseInt(document.getElementById('fill-opacity').value) / 100;
    const selIdx = selections.length;
    selections.push({ x:x1, y:y1, w, h, color, opacity, id: Date.now() });
    updateSelList();
    drawOverlay();
  } else {
    octx.clearRect(0, 0, overlay.width, overlay.height);
  }
});

function drawOverlay() {
  octx.clearRect(0, 0, overlay.width, overlay.height);

  // Sélections existantes
  selections.forEach((s, i) => {
    octx.fillStyle = s.color + Math.round(s.opacity * 80).toString(16).padStart(2,'0');
    octx.fillRect(s.x, s.y, s.w, s.h);
    octx.strokeStyle = s.color;
    octx.lineWidth = 2;
    octx.strokeRect(s.x+1, s.y+1, s.w-2, s.h-2);
    // Label
    octx.fillStyle = '#fff';
    octx.font = 'bold 11px sans-serif';
    octx.fillText(`#${i+1}`, s.x+4, s.y+14);
  });

  // Sélection en cours
  if (dragging) {
    const x1 = Math.min(startX, curX), y1 = Math.min(startY, curY);
    const w = Math.abs(curX - startX), h = Math.abs(curY - startY);
    octx.strokeStyle = '#fff';
    octx.lineWidth = 1.5;
    octx.setLineDash([5,3]);
    octx.strokeRect(x1, y1, w, h);
    octx.setLineDash([]);
    octx.fillStyle = 'rgba(255,255,255,0.08)';
    octx.fillRect(x1, y1, w, h);
    // Dimensions
    octx.fillStyle = '#fff';
    octx.font = '11px monospace';
    octx.fillText(`${w}×${h}px`, x1+4, y1-4);
  }
}

function updateSelList() {
  document.getElementById('sel-count').textContent = selections.length;
  const container = document.getElementById('sel-items');
  container.innerHTML = '';
  selections.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'sel-item';
    div.innerHTML = `
      <div class="sel-color" style="background:${s.color}"></div>
      <div class="sel-info">#${i+1} — x:${s.x} y:${s.y} taille:${s.w}×${s.h}px — opacité:${Math.round(s.opacity*100)}%</div>
      <button class="sel-remove" onclick="removeSel(${s.id})">✕</button>`;
    container.appendChild(div);
  });
}

window.removeSel = (id) => {
  selections = selections.filter(s => s.id !== id);
  updateSelList();
  drawOverlay();
};

// ——— Appliquer sélections sur le canvas ———
document.getElementById('btn-apply').onclick = () => {
  if (selections.length === 0) { alert('Aucune sélection !'); return; }
  history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));

  selections.forEach(s => {
    const r = parseInt(s.color.slice(1,3), 16);
    const g = parseInt(s.color.slice(3,5), 16);
    const b = parseInt(s.color.slice(5,7), 16);
    const data = ctx.getImageData(s.x, s.y, s.w, s.h);
    const px = data.data;
    for (let i = 0; i < px.length; i += 4) {
      px[i]   = Math.round(px[i]   * (1 - s.opacity) + r * s.opacity);
      px[i+1] = Math.round(px[i+1] * (1 - s.opacity) + g * s.opacity);
      px[i+2] = Math.round(px[i+2] * (1 - s.opacity) + b * s.opacity);
    }
    ctx.putImageData(data, s.x, s.y);
  });

  selections = [];
  updateSelList();
  octx.clearRect(0, 0, overlay.width, overlay.height);
  alert(`✅ ${selections.length === 0 ? 'Sélections appliquées !' : ''}`);
};

// ——— Annuler ———
document.getElementById('btn-undo').onclick = () => {
  if (history.length <= 1) { alert('Rien à annuler !'); return; }
  history.pop();
  ctx.putImageData(history[history.length - 1], 0, 0);
  drawOverlay();
};

// ——— Tout effacer les sélections ———
document.getElementById('btn-clear').onclick = () => {
  selections = [];
  updateSelList();
  octx.clearRect(0, 0, overlay.width, overlay.height);
};

// ——— Télécharger ———
document.getElementById('btn-download').onclick = () => {
  // Fusionner canvas + overlay
  const tmp = document.createElement('canvas');
  tmp.width = canvas.width; tmp.height = canvas.height;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(canvas, 0, 0);
  tctx.drawImage(overlay, 0, 0);
  const a = document.createElement('a');
  a.download = 'big_bang_edited.png';
  a.href = tmp.toDataURL('image/png');
  a.click();
};

// ——— Sync mode label ———
document.getElementById('mode').onchange = (e) => {
  const labels = {inspect:'🔍 Inspecter', select:'⬛ Sélectionner'};
  document.getElementById('mode-display').textContent = labels[e.target.value];
};

document.getElementById('fill-opacity').oninput = (e) => {
  document.getElementById('opacity-val').textContent = e.target.value + '%';
};
</script>
</body>
</html>
